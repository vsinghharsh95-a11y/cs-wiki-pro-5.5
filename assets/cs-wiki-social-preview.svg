<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">CS WIKI — Curious minds welcome</title>
<desc id="desc">A dark futuristic computer science banner with glowing blue and violet network nodes, circuits, and the words CS WIKI, Curious minds welcome, Explore. Understand. Experiment.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080912"/><stop offset=".55" stop-color="#10152a"/><stop offset="1" stop-color="#090b18"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#56d8ff"/><stop offset=".52" stop-color="#7b7cff"/><stop offset="1" stop-color="#c26cff"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#555dff" stop-opacity=".26"/><stop offset="1" stop-color="#555dff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8796d8" stroke-opacity=".075" stroke-width="1"/></pattern>
</defs>
