name: Generate CS Wiki social preview PNG

on:
  push:
    branches: [main]
    paths:
      - "assets/cs-wiki-social-preview.svg"
      - ".github/workflows/generate-social-preview.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render 1200x630 PNG
        run: rsvg-convert -w 1200 -h 630 -o assets/cs-wiki-social-preview.png assets/cs-wiki-social-preview.svg
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cs-wiki-social-preview.png
          if git diff --cached --quiet; then
            echo "PNG is already up to date"
            exit 0
          fi
          git commit -m "Add PNG social preview for CS Wiki"
          git push
